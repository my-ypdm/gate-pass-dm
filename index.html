<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Piket SMA Dua Mei</title>
    
    <!-- PWA & External Resources -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <!-- Memanggil CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- 1. FORM LOGIN -->
    <div id="login-section" class="card">
        <div class="login-card-header">
            <img src="icon.png" alt="Logo SMA Dua Mei" class="login-logo">
            <h2>e-Piket</h2>
            <p>SMA Dua Mei</p>
        </div>
        <input type="text" id="username" placeholder="Username Petugas" required>
        <input type="password" id="password" placeholder="Password / PIN" required>
        <button class="btn-primary" id="btn-login" onclick="handleLogin()">Masuk Terminal</button>
    </div>

    <!-- 2. DASHBOARD PETUGAS & TERMINAL SCANNER -->
    <div id="dashboard-section" class="hidden" style="display: flex; flex-direction: column; gap: 15px;">
    
        <div class="card header-card">
            <div class="user-info-wrapper">
                <img src="icon.png" alt="Logo" class="header-logo">
                <div class="user-info">
                    <h3 id="display-nama">Petugas Piket</h3>
                    <p id="display-role">Piket Gerbang - SMA Dua Mei</p>
                </div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Keluar</button>
        </div>

        <div class="card">
            <div class="time-bar" id="live-clock">-</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span>Tepat Waktu</span>
                    <strong id="count-hadir">0</strong>
                </div>
                <div class="stat-box">
                    <span>Terlambat</span>
                    <strong id="count-telat">0</strong>
                </div>
                <div class="stat-box">
                    <span>Total Scan</span>
                    <strong id="count-total">0</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Status Presensi Siswa:</div>
            <select id="status-select" class="status-dropdown" onchange="onStatusDropdownChange(this)">
                <option value="H">🟢 Hadir Tepat Waktu</option>
                <option value="T1">🟡 Terlambat Ringan</option>
                <option value="T2">🟠 Terlambat Sedang</option>
                <option value="T3">🔴 Terlambat Berat</option>
            </select>
        </div>

        <!-- SCANNER & PREVIEW CARD -->
        <div class="card" style="padding: 10px;">
            <!-- Area Kamera -->
            <div id="scanner-container">
                <div id="reader"></div>
            </div>

            <!-- Card Preview Data Siswa Sebelum Submit -->
            <div id="preview-card">
                <h4>📋 Konfirmasi Data Siswa</h4>
                <div class="student-detail" id="prev-nama">-</div>
                <div class="student-sub" id="prev-kelas">-</div>
                <div class="student-sub" style="margin-bottom: 8px;">NIS: <span id="prev-nis">-</span></div>
                <div style="font-size: 13px; font-weight: bold; color: #ea580c; margin-bottom: 8px;">
                    Status Dipilih: <span id="prev-status" style="background: #ffedd5; padding: 3px 8px; border-radius: 6px;">H</span>
                </div>
                <div class="btn-group">
                    <button class="btn-submit" onclick="submitAbsensi()">✅ Konfirmasi & Simpan</button>
                    <button class="btn-cancel" onclick="cancelPreview()">❌ Batal</button>
                </div>
            </div>

            <div id="message"></div>
        </div>

    </div>

</div>

<!-- Memanggil JavaScript Terpisah -->
<script src="script.js"></script>

</body>
</html>
